<script>
  /* Apply the saved theme, or the system's, before the page is drawn. */
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('jtd-theme'); } catch (e) {}
    var dark = saved ? saved === 'dark'
      : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) jtd.setTheme('dark');
  })();
</script>

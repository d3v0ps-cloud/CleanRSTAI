name: Persistent Cargo target directory
description: >-
  Points CARGO_TARGET_DIR at a folder in the runner's tool cache, so builds on our persistent
  self-hosted runners reuse the last run's artifacts instead of uploading and downloading
  gigabytes through the GitHub Actions cache. Run it after the Rust toolchain is on PATH.
inputs:
  max-gb:
    description: Wipe the folder when it grows past this many GiB.
    default: "30"
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        dir="$RUNNER_TOOL_CACHE/cleanrstai-target"
        # Git Bash on Windows: a C:/… path works for both bash and cargo.
        command -v cygpath >/dev/null && dir=$(cygpath -m "$dir")
        mkdir -p "$dir"

        # Artifacts from another compiler are never reused, so start over when it changes.
        toolchain=$(rustc -vV)
        if [ "$(cat "$dir/.toolchain" 2>/dev/null)" != "$toolchain" ]; then
          echo "Rust toolchain changed; clearing $dir"
          rm -rf "$dir" && mkdir -p "$dir"
          printf '%s' "$toolchain" > "$dir/.toolchain"
        fi

        # Dependency upgrades leave old artifacts behind; cap the size.
        size_gb=$(( $(du -sm "$dir" | cut -f1) / 1024 ))
        if [ "$size_gb" -ge "${{ inputs.max-gb }}" ]; then
          echo "$dir is ${size_gb} GiB; clearing it"
          rm -rf "$dir" && mkdir -p "$dir"
          printf '%s' "$toolchain" > "$dir/.toolchain"
        fi

        echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
        echo "Cargo target directory: $dir (${size_gb} GiB)"

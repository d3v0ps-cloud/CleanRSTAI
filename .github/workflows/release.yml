name: Release

# Push a tag like `v0.1.0` (or run it manually with a version) to build every OS and create a
# GitHub Release with the binaries attached.
# A manual run without a version only builds; the binaries are kept as workflow artifacts.
#
# Code signing is optional and switches on when these repository secrets exist:
#   macOS (Developer ID + notarization):
#     APPLE_CERTIFICATE           base64 of the "Developer ID Application" .p12 export
#     APPLE_CERTIFICATE_PASSWORD  password of that .p12
#     APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Jane Doe (TEAMID1234)"
#     APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   (app-specific password, for notarytool)
#   Windows (Authenticode):
#     WINDOWS_CERTIFICATE           base64 of the code-signing .pfx
#     WINDOWS_CERTIFICATE_PASSWORD  password of that .pfx
# Without them, the macOS app is ad-hoc signed and the Windows files are unsigned.
#
# Runs on the self-hosted runners: the Mac mini builds the macOS app, DARKBASE builds the
# Windows .zip and .msi, and the Gentoo box cross-builds both Linux architectures (with
# cargo-zigbuild, against glibc 2.28 so the binaries also run on older distributions) and
# publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.1.0 (leave empty to only build)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            runner: [self-hosted, macOS, ARM64]
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: linux
            runner: [self-hosted, Linux, X64, gentoo]
            targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
          - name: windows-x86_64
            runner: [self-hosted, Windows, X64]
            targets: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Git Bash for bash steps
        # On Windows, a plain `bash` is System32's WSL launcher, which fails without a Linux
        # distribution. Put Git for Windows' bash first for the rest of the job.
        # cmd, not PowerShell: the runner's execution policy may block PowerShell scripts.
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (
            echo ::error::Git for Windows is not installed in %ProgramFiles%\Git
            exit /b 1
          )
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Put the rustup toolchain ahead of any system Rust
        # The Gentoo box also has a system Rust earlier on PATH, which would otherwise win.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/rustc" --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Check tag matches Cargo.toml version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Build macOS universal .app
        if: runner.os == 'macOS'
        run: |
          command -v cargo-bundle >/dev/null || cargo install cargo-bundle --locked
          cargo bundle --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          APP=target/aarch64-apple-darwin/release/bundle/osx/CleanRSTAI.app
          lipo -create -output "$APP/Contents/MacOS/cleanrstai" \
            target/aarch64-apple-darwin/release/cleanrstai \
            target/x86_64-apple-darwin/release/cleanrstai
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Sign, notarize and package macOS
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          mkdir -p dist
          DMG="dist/CleanRSTAI-${{ matrix.name }}.dmg"
          ZIP="dist/CleanRSTAI-${{ matrix.name }}.zip"
          make_dmg() {
            staging=$(mktemp -d)
            cp -R "$APP" "$staging/"
            ln -s /Applications "$staging/Applications"
            # hdiutil's own size estimate for -srcfolder can come up short ("No space left on
            # device" while copying), so size the image from the contents plus headroom.
            size_mb=$(( $(du -sm "$staging" | cut -f1) * 3 / 2 + 20 ))
            hdiutil create -volname CleanRSTAI -srcfolder "$staging" -size "${size_mb}m" \
              -ov -format UDZO "$DMG"
          }

          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::No Apple signing certificate configured; using an ad-hoc signature."
            codesign --force --deep --sign - "$APP"
            ditto -c -k --keepParent "$APP" "$ZIP"
            make_dmg
            exit 0
          fi

          # Import the certificate into a throwaway keychain.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

          notarize() {
            xcrun notarytool submit "$1" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
          }
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          notarize "$RUNNER_TEMP/notarize.zip"
          xcrun stapler staple "$APP"

          ditto -c -k --keepParent "$APP" "$ZIP"
          make_dmg
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
          notarize "$DMG"
          xcrun stapler staple "$DMG"
          security delete-keychain "$KEYCHAIN"

      - name: Remove the temporary signing keychain
        # The Mac mini is a persistent machine: never leave the imported certificate behind.
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Build Linux (x86_64 and aarch64)
        if: runner.os == 'Linux'
        # No system packages needed: X11/Wayland/xkbcommon are loaded at runtime. Zig (from
        # PyPI, in a throwaway venv) is the cross linker, so no crossdev toolchain is needed.
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet ziglang
          export PATH="$RUNNER_TEMP/zig/bin:$PATH"
          command -v cargo-zigbuild >/dev/null || cargo install cargo-zigbuild --locked
          mkdir -p dist
          for arch in x86_64 aarch64; do
            cargo zigbuild --release --target "$arch-unknown-linux-gnu.2.28"
            tar -czf "dist/CleanRSTAI-linux-$arch.tar.gz" -C "target/$arch-unknown-linux-gnu/release" cleanrstai
          done

      - name: Build Windows
        # The PowerShell steps below bypass the machine's script execution policy for their
        # own process only (Windows PowerShell blocks scripts by default), and check exit
        # codes themselves.
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows (.zip and .msi)
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = [bool]$env:WINDOWS_CERTIFICATE
          if ($signed) {
            $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1).FullName
            function Sign($file) {
              & $signtool sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
                /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $file
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            Sign target/release/cleanrstai.exe
          } else {
            Write-Output "::notice::No Windows signing certificate configured; files are unsigned."
          }

          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/cleanrstai.exe -DestinationPath "dist/CleanRSTAI-${{ matrix.name }}.zip"

          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          # DARKBASE keeps its tools between runs: install WiX once into the runner's tool
          # cache (a global install fails when it is already there, and its folder may not be
          # on the runner's PATH) and call it by its full path.
          $wixDir = Join-Path $env:RUNNER_TOOL_CACHE "wix-5.0.2"
          $wix = Join-Path $wixDir "wix.exe"
          if (-not (Test-Path $wix)) {
            dotnet tool install wix --version 5.0.2 --tool-path $wixDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # MSI versions are numbers only: a pre-release like 0.8.0-dev.1 installs as 0.8.0.
          $msiVersion = $version -replace '[-+].*$', ''
          $msi = "dist/CleanRSTAI-${{ matrix.name }}.msi"
          & $wix build packaging/windows/main.wxs -arch x64 -d "Version=$msiVersion" `
            -d "Exe=target\release\cleanrstai.exe" -d "Icon=assets\icon\icon.ico" -o $msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item dist/*.wixpdb -ErrorAction SilentlyContinue

          if ($signed) {
            Sign $msi
            Remove-Item $pfx
          }

      - name: Remove the signing certificate
        # DARKBASE is a persistent machine: never leave the decoded .pfx behind, even when a
        # step above failed.
        if: always() && runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: Remove-Item (Join-Path $env:RUNNER_TEMP "cert.pfx") -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        with:
          name: CleanRSTAI-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: [self-hosted, Linux, X64, gentoo]
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Creates the tag on this commit when it doesn't exist yet (manual runs).
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}

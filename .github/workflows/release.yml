name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo install cargo-bundle --locked
      - name: Build universal .app
        run: |
          cargo bundle --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          APP=target/aarch64-apple-darwin/release/bundle/osx/CleanRSTAI.app
          lipo -create -output "$APP/Contents/MacOS/cleanrstai" \
            target/aarch64-apple-darwin/release/cleanrstai \
            target/x86_64-apple-darwin/release/cleanrstai
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" CleanRSTAI-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CleanRSTAI-macos
          path: CleanRSTAI-macos-universal.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --release
      - run: tar -czf CleanRSTAI-linux-x86_64.tar.gz -C target/release cleanrstai
      - uses: actions/upload-artifact@v4
        with:
          name: CleanRSTAI-linux
          path: CleanRSTAI-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: Compress-Archive -Path target/release/cleanrstai.exe -DestinationPath CleanRSTAI-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CleanRSTAI-windows
          path: CleanRSTAI-windows-x86_64.zip

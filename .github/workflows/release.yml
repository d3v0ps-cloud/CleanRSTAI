name: Release

# Push a tag like `v0.1.0` to build every OS, create a GitHub Release, and publish the
# binaries to GitHub Packages (ghcr.io, as an OCI artifact).
# Running it manually only builds; the binaries are kept as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Build macOS universal .app
        if: runner.os == 'macOS'
        run: |
          cargo install cargo-bundle --locked
          cargo bundle --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          APP=target/aarch64-apple-darwin/release/bundle/osx/CleanRSTAI.app
          lipo -create -output "$APP/Contents/MacOS/cleanrstai" \
            target/aarch64-apple-darwin/release/cleanrstai \
            target/x86_64-apple-darwin/release/cleanrstai
          codesign --force --deep --sign - "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/CleanRSTAI-${{ matrix.name }}.zip"

      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          cargo build --release
          mkdir -p dist
          tar -czf "dist/CleanRSTAI-${{ matrix.name }}.tar.gz" -C target/release cleanrstai

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/cleanrstai.exe -DestinationPath "dist/CleanRSTAI-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: CleanRSTAI-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - uses: oras-project/setup-oras@v1

      - name: Publish to GitHub Packages (ghcr.io)
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/cleanrstai"
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          files=()
          for f in *; do
            case "$f" in
              *.zip) files+=("$f:application/zip") ;;
              *.tar.gz) files+=("$f:application/gzip") ;;
              *) files+=("$f:text/plain") ;;
            esac
          done
          tags="${GITHUB_REF_NAME}"
          case "$GITHUB_REF_NAME" in *-*) ;; *) tags="$tags,latest" ;; esac
          oras push "$image:$tags" \
            --artifact-type application/vnd.cleanrstai.release.v1 \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.description=CleanRSTAI desktop builds for macOS, Linux and Windows" \
            --annotation "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            "${files[@]}"
          {
            echo "### Published to GitHub Packages"
            echo
            echo '```sh'
            echo "oras pull $image:${GITHUB_REF_NAME}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

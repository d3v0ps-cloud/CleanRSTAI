name: CI

# Runs on the self-hosted runners: the Gentoo box (Linux x64) and the Mac mini (macOS
# ARM64). Windows is disabled for now; see the commented matrix entry below.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: [self-hosted, Linux, X64, gentoo]
          - name: macos-arm64
            runner: [self-hosted, macOS, ARM64]
          # Disabled until there is a Windows runner (GitHub-hosted would use Actions minutes):
          # - name: windows-x64
          #   runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # No system packages needed on Linux: X11/Wayland/xkbcommon are loaded at runtime.
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Warm the npm cache for the e2e tests
        # A cold download of the test MCP server can take minutes; do it once here so no
        # test spends its timeout on it. The server exits when stdin closes.
        shell: bash
        run: npx -y @modelcontextprotocol/server-everything < /dev/null
      - name: End-to-end MCP tests (stdio + Streamable HTTP)
        run: cargo test -- --ignored

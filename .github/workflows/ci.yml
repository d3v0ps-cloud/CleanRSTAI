name: CI

# Manual only for now (Actions → CI → Run workflow): the account's Actions minutes ran out,
# so builds and tests run locally (see "Releasing without GitHub Actions" in the README).
# To re-enable automatic runs, restore:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Warm the npm cache for the e2e tests
        # A cold download of the test MCP server can take minutes on CI runners; do it once
        # here so no test spends its timeout on it. The server exits when stdin closes.
        shell: bash
        run: npx -y @modelcontextprotocol/server-everything < /dev/null
      - name: End-to-end MCP tests (stdio + Streamable HTTP)
        run: cargo test -- --ignored

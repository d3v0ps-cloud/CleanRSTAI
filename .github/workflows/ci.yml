name: CI

# Runs on the self-hosted runners: the Gentoo box (Linux x64), the Mac mini (macOS ARM64)
# and DARKBASE (Windows x64).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    # The runners are our own machines, and the repository is public: never run a pull
    # request from a fork on them (it could change the build to run anything). Pushes,
    # manual runs and PRs from branches of this repository still run. A fork's PR could edit
    # this line too, so "Require approval for all external contributors" (Settings → Actions)
    # stays on as well: check a fork's changes to .github/ before approving its run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: [self-hosted, Linux, X64, gentoo]
          - name: macos-arm64
            runner: [self-hosted, macOS, ARM64]
          - name: windows-x64
            runner: [self-hosted, Windows, X64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Git Bash for bash steps
        # On Windows, a plain `bash` is System32's WSL launcher, which fails without a Linux
        # distribution. Put Git for Windows' bash first for the rest of the job.
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $gitBash = Join-Path $env:ProgramFiles "Git\bin"
          if (-not (Test-Path (Join-Path $gitBash "bash.exe"))) {
            Write-Output "::error::Git for Windows is not installed at $gitBash"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $gitBash
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Put the rustup toolchain ahead of any system Rust
        # The Gentoo box also has a system Rust earlier on PATH, which would otherwise win.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/rustc" --version
      - uses: Swatinem/rust-cache@v2
      # No system packages needed on Linux: X11/Wayland/xkbcommon are loaded at runtime.
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Warm the npm cache for the e2e tests
        # A cold download of the test MCP server can take minutes; do it once here so no
        # test spends its timeout on it. The server exits when stdin closes.
        shell: bash
        run: npx -y @modelcontextprotocol/server-everything < /dev/null
      - name: End-to-end MCP tests (stdio + Streamable HTTP)
        run: cargo test -- --ignored

name: Sandbox image

# Builds the full example sandbox image (assets/sandbox/full.Dockerfile) for linux/amd64 and
# linux/arm64 and pushes it to GitHub Packages as ghcr.io/<owner>/cleanrstai-sandbox.
# Runs only when that Dockerfile changes on main or dev, or by hand (workflow_dispatch).
# Tags: `full` and `latest` from main, `full-dev` from dev, and on both `full-<hash>` (the first
# 12 hex digits of the Dockerfile's SHA-256, the same hash the app tags its own build with)
# and `sha-<commit>`.
#
# Runs on any self-hosted Linux x64 runner, which needs Docker. arm64 is built with QEMU:
# setup-qemu-action registers binfmt handlers on the runner's kernel (they stay after the job).
# No pull_request trigger, so a fork can't run this on our machines or push the image.
on:
  push:
    branches: [main, dev]
    paths:
      - "assets/sandbox/full.Dockerfile"
  workflow_dispatch:

concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7

      - name: Image name and Dockerfile hash
        id: names
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cleanrstai-sandbox" >> "$GITHUB_OUTPUT"
          echo "hash=$(sha256sum assets/sandbox/full.Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=raw,value=full,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=full-dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=full-${{ steps.names.outputs.hash }}
            type=sha
          labels: |
            org.opencontainers.image.title=CleanRSTAI sandbox (full)
            org.opencontainers.image.description=Python, Node.js, build tools and network tools for the CleanRSTAI Docker sandbox

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # The builder is removed again when the job ends (the runner is a persistent machine).
      - uses: docker/setup-buildx-action@v4

      # Logs out again when the job ends.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: assets/sandbox
          file: assets/sandbox/full.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sandbox-full
          cache-to: type=gha,scope=sandbox-full,mode=max

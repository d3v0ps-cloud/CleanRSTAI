[package]
name = "cleanrstai"
version = "0.9.2-dev.4"
edition = "2024"
rust-version = "1.95"
description = "A cross-platform desktop AI chat client for OpenAI-compatible endpoints with MCP support"
license = "MIT"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
egui_commonmark = { version = "0.26", features = ["better_syntax_highlighting", "embedded_image", "svg", "fetch"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net"] }
reqwest = { version = "0.13", features = ["json", "stream", "form", "query", "multipart"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
which = "8"
log = "0.4"
env_logger = "0.11"
rfd = "0.17"
keyring = "4"
egui_extras = { version = "0.37", features = ["image", "gif", "webp", "svg", "svg_text"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
sha2 = "0.10"
html2text = "0.17"
ignore = "0.4"
globset = "0.4"
regex = "1"
similar = "2"
open = "5"
# Document attachments: text extraction for PDF, Office (OOXML and legacy binary),
# OpenDocument and RTF files.
pdf-extract = "0.12"
# Page images of scanned PDFs, for OCR (the same lopdf pdf-extract uses).
lopdf = { version = "0.42", default-features = false }
calamine = { version = "0.37", features = ["dates"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
cfb = "0.15"
encoding_rs = "0.8"
axum = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Verifies the RSA signature on Cloudflare Access tokens (already linked through rustls).
ring = "0.17"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.13"
# Desktop notifications for finished, failed and approval-waiting replies (Settings → Background).
# `z` selects the pure Rust D-Bus client (zbus) on Linux, so no libdbus is linked; macOS and
# Windows use their own notification APIs.
notify-rust = { version = "4.18", default-features = false, features = ["z"] }
# Save as PDF (Save replies or artifacts as files, src/save_as.rs): pure Rust layout and
# embedding of the static Instrument Sans and IBM Plex Mono fonts in assets/fonts.
genpdf = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `cleanrstai exec` attaches to the console that started it (the windows subsystem has none).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

# Linux loads WebKitGTK and GTK at run time (the release builds link neither), so the live
# preview needs only this pure Rust crate; see src/ui/linux_preview.rs.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

# The live preview of web page artifacts: WKWebView on macOS, WebView2 on Windows. Linux has
# its own window (src/ui/linux_preview.rs) when WebKitGTK is installed.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "0.57", default-features = false }
# Voice input: the default microphone, captured to WAV (Linux records with pw-record, parecord or
# arecord instead, because cpal needs ALSA headers the release builds don't have). Reading replies
# aloud plays WAV through the default output device the same way.
cpal = "0.18"
# The menu bar (macOS) or system tray (Windows) icon for "Keep running when the window is closed".
# tray-icon needs GTK on Linux, which the release builds don't link, so Linux has no tray.
tray-icon = "0.26.1"

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
# Tests only: an RSA key made at run time for the Cloudflare Access tests (src/remote/access.rs).
rand = "0.8"
rsa = "0.9"

# Making that key is slow without optimisation.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[build-dependencies]
# The Windows .exe icon (build.rs); does nothing for other targets.
winresource = "0.1"

[package.metadata.bundle]
name = "CleanRSTAI"
identifier = "net.bukn.cleanrstai"
category = "public.app-category.productivity"
short_description = "AI chat client with MCP support"
# Made by scripts/make-icons.py; cargo-bundle builds the .icns from these.
icon = [
  "assets/icon/macos/icon_16x16.png",
  "assets/icon/macos/icon_16x16@2x.png",
  "assets/icon/macos/icon_32x32.png",
  "assets/icon/macos/icon_32x32@2x.png",
  "assets/icon/macos/icon_128x128.png",
  "assets/icon/macos/icon_128x128@2x.png",
  "assets/icon/macos/icon_256x256.png",
  "assets/icon/macos/icon_256x256@2x.png",
  "assets/icon/macos/icon_512x512.png",
  "assets/icon/macos/icon_512x512@2x.png",
]

# egui_commonmark's shared backend with two local fixes: bold text uses the fonts' weight axis
# (egui's `strong()` only changes colour), and the code-block copy button sits inside the block
# instead of half outside it. See vendor/egui_commonmark_backend/VENDORED.md.
[patch.crates-io]
egui_commonmark_backend = { path = "vendor/egui_commonmark_backend" }
